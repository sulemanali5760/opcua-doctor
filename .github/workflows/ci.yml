name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt -e .
      - name: Tests (each one breaks a connection in one specific way)
        run: python -m pytest -v
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit -r requirements-dev.txt
