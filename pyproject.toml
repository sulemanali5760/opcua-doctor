[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opcua-doctor"
version = "0.1.0"
description = "Find out why an OPC UA connection fails, and what to do about it: endpoints, certificates, trust, login, explained step by step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suleman Ali" }]
keywords = ["opc-ua", "opcua", "troubleshooting", "certificates", "industrial-automation", "plc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["asyncua>=1.1,<3"]

[project.urls]
Repository = "https://github.com/sulemanali5760/opcua-doctor"

[project.scripts]
opcua-doctor = "opcua_doctor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
